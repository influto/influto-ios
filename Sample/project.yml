# XcodeGen spec for the InfluTo iOS sample app.
#
# We ship a project.yml (not a committed .xcodeproj) so the sample is authorable
# without a Mac and regenerates deterministically in CI:
#   brew install xcodegen && xcodegen generate
#
# The app target depends on the InfluTo SPM package at the repo root (../).
name: InfluToSample
options:
  bundleIdPrefix: to.influ
  deploymentTarget:
    # iOS 17: the sample's SKTestSession test uses the async buyProduct(identifier:)
    # API (iOS 17+). The InfluTo SDK itself still supports iOS 16.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Simulator builds + tests need no code signing.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

packages:
  InfluTo:
    path: ..

targets:
  InfluToSample:
    type: application
    platform: iOS
    sources:
      - Sources/InfluToSample
    dependencies:
      - package: InfluTo
        product: InfluTo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.influ.sample
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: InfluTo Sample
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

  InfluToSampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/InfluToSampleTests
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: InfluToSample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.influ.sample.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  InfluToSample:
    build:
      targets:
        InfluToSample: all
        InfluToSampleTests: [test]
    # The SKTestSession is created in code from the bundled Products.storekit
    # (reliable under CLI xcodebuild on Xcode ≤ 16). Xcode 26 additionally
    # requires the scheme-level StoreKit configuration: without it the test
    # runner lacks the StoreKit-Testing entitlement and every SKTestSession
    # call fails with SKInternalErrorDomain Code=3 / purchases "notEntitled".
    # Both mechanisms coexist; the in-code session still drives the tests.
    run:
      storeKitConfiguration: Products.storekit
    test:
      targets:
        - InfluToSampleTests
      gatherCoverageData: false
      storeKitConfiguration: Products.storekit
